# Construye la web con el generador y la publica en GitHub Pages
# cada vez que se guarda un cambio en la carpeta generador/.
name: Construir y publicar la web

on:
  push:
    branches: [main]
    paths: ['generador/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construir la web
        env:
          SALIDA: ${{ github.workspace }}/_salida
        run: python generador/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _salida/web
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
